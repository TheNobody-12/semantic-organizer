[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "semantic-organizer"
version = "0.1.0"
description = "A semantic document organizer using LLMs"
authors = [{name = "Sarthak Kapaliya"}]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "typer>=0.12.3",
    "rich>=13.7.1",
    "structlog>=24.1.0",
    "pydantic>=2.7.1",
    "pyyaml>=6.0.1",
    "docling>=2.3.0",
    "docling-graph[cli]>=0.1.0",
    "networkx>=3.3",
    "openai>=1.30.1",
    "litellm>=1.38.1",
    "prompt-toolkit>=3.0.47",
    "pyvis>=0.3.2",
    "reportlab>=5.0.1",
]

[project.scripts]
semantic-organizer = "semantic_organizer.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/semantic_organizer"]

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
strict = false
ignore_missing_imports = true
